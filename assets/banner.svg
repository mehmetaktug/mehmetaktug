<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mehmet Aktug, Co-founder and COO at Zeo, Generative AI and GEO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#151b33"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g transform="translate(1030 150)">
    <circle r="70" fill="none" stroke="#1d2540" stroke-width="26"/>
    <circle r="70" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round" stroke-dasharray="300 140" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite"/>
      <circle cx="0" cy="-108" r="5" fill="#a78bfa"/><circle cx="96" cy="50" r="4" fill="#22d3ee"/><circle cx="-90" cy="62" r="3.5" fill="#34d399"/></g>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="125" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Mehmet Aktug</text>
    <text x="72" y="170" font-size="26" fill="#c7d2fe">Co-founder &amp; COO at Zeo · Generative AI &amp; GEO · Lisbon</text>
    <g font-size="17" font-weight="600" fill="#e2e8f0">
      <rect x="72" y="198" width="150" height="36" rx="18" fill="#7c3aed" fill-opacity="0.35" stroke="#8b5cf6"/><text x="147" y="222" text-anchor="middle">Generative AI</text>
      <rect x="234" y="198" width="70" height="36" rx="18" fill="#10b981" fill-opacity="0.25" stroke="#34d399"/><text x="269" y="222" text-anchor="middle">GEO</text>
      <rect x="316" y="198" width="70" height="36" rx="18" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee"/><text x="351" y="222" text-anchor="middle">MCP</text>
      <rect x="398" y="198" width="198" height="36" rx="18" fill="#f38020" fill-opacity="0.25" stroke="#f38020"/><text x="497" y="222" text-anchor="middle">Cloudflare Workers</text>
    </g>
  </g>
  <path d="M70 268 H520 L538 268 L552 244 L570 290 L586 258 L598 268 H1130" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1100" stroke-dashoffset="1100" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="1100;0;0;-1100" keyTimes="0;0.45;0.6;1" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
